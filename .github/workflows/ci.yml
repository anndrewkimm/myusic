name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # WPF/WinForms + Windows-only APIs (WASAPI, SMTC) — must build on Windows, not the default Linux runner.
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Hookline.sln

      - name: Build
        run: dotnet build Hookline.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test Hookline.sln --configuration ${{ matrix.configuration }} --no-build --verbosity normal
